<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patent Hunter CME/CSSD/SPD</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/base.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --surface: #0d1424;
      --surface2: #131c30;
      --border: #1e2d4a;
      --accent: #00e5ff;
      --purple: #8b5cf6;
      --green: #22d3a0;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; }
    .badge-lens { background:#0e3a5c; color:#00e5ff; border:1px solid #00e5ff44; }
    .badge-epo  { background:#2d1b5c; color:#a78bfa; border:1px solid #8b5cf644; }
    .badge-inpi { background:#0d3b2e; color:#22d3a0; border:1px solid #22d3a044; }

    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .btn-primary { background:var(--accent); color:#070b14; }
    .btn-primary:hover:not(:disabled) { filter:brightness(1.15); }
    .btn-green  { background:var(--green); color:#070b14; }
    .btn-green:hover:not(:disabled) { filter:brightness(1.1); }
    .btn-purple { background:var(--purple); color:#fff; }
    .btn-purple:hover:not(:disabled) { filter:brightness(1.15); }

    .input { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 10px; font-size:13px; width:100%; outline:none; }
    .input:focus { border-color:var(--accent); }

    .toggle { position:relative; width:38px; height:20px; }
    .toggle input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; inset:0; background:#1e2d4a; border-radius:999px; transition:.2s; }
    .slider:before { position:absolute; content:""; height:14px; width:14px; left:3px; bottom:3px; background:#64748b; border-radius:50%; transition:.2s; }
    input:checked + .slider { background:var(--accent); }
    input:checked + .slider:before { transform:translateX(18px); background:#070b14; }

    .log-line { font-family: monospace; font-size:12px; padding:2px 0; }
    .log-info    { color:#94a3b8; }
    .log-success { color:var(--green); }
    .log-error   { color:var(--red); }
    .log-warn    { color:var(--yellow); }

    .progress-bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--purple)); border-radius:2px; transition:width .4s ease; }

    .tab { padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; color:var(--muted); transition:.15s; }
    .tab.active { border-bottom-color:var(--accent); color:var(--accent); }

    .stat-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 16px; text-align:center; }
    .stat-val { font-size:24px; font-weight:700; }
    .stat-lbl { font-size:11px; color:var(--muted); margin-top:2px; }

    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { background:var(--surface2); color:var(--muted); font-weight:600; padding:8px 10px; text-align:left; position:sticky; top:0; border-bottom:1px solid var(--border); }
    td { padding:6px 10px; border-bottom:1px solid var(--border); vertical-align:top; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    tr:hover td { background:var(--surface2); }

    .fonte-lens { color:var(--accent); }
    .fonte-epo  { color:#a78bfa; }
    .fonte-inpi { color:var(--green); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Queries list ─────────────────────────────────────────────────────────────
const QUERIES = [
  { id:"Q1_PT_CME_sistema",    fonte:"Lens", desc:"CME + rastreabilidade/sistema (PT)" },
  { id:"Q2_EN_CSSD_software",  fonte:"Lens", desc:"CSSD/SPD management software (EN)" },
  { id:"Q3_EN_decision_support",fonte:"Lens", desc:"Sterile processing decision support" },
  { id:"Q4_IPC_G16H",          fonte:"Lens", desc:"IPC G16H – saúde digital + esterilização" },
  { id:"Q5_IPC_A61L",          fonte:"Lens", desc:"IPC A61L2 – esterilização + software" },
  { id:"Q6_EN_non_conformance",fonte:"Lens", desc:"Non-conformance / quality control" },
  { id:"EPO_Q1",               fonte:"EPO",  desc:"CSSD software traceability" },
  { id:"EPO_Q2",               fonte:"EPO",  desc:"Sterilization instrument tracking" },
  { id:"EPO_Q3",               fonte:"EPO",  desc:"IPC G16H + sterile processing" },
  { id:"EPO_Q4",               fonte:"EPO",  desc:"IPC A61L2 + software/tracking" },
  { id:"INPI_Q1",              fonte:"INPI", desc:"CME + rastreabilidade" },
  { id:"INPI_Q2",              fonte:"INPI", desc:"Esterilização + sistema/software" },
  { id:"INPI_Q3",              fonte:"INPI", desc:"Central esterilização + software" },
  { id:"INPI_Q4",              fonte:"INPI", desc:"Esterilização + gestão processos" },
  { id:"INPI_Q5",              fonte:"INPI", desc:"Instrumental cirúrgico + rastreabilidade" },
  { id:"INPI_Q6",              fonte:"INPI", desc:"Tomada de decisão + esterilização" },
];

// ── Components ────────────────────────────────────────────────────────────────
function Header() {
  return (
    <header style={{background:'var(--surface)', borderBottom:'1px solid var(--border)', padding:'14px 24px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'16px',flexWrap:'wrap'}}>
        <div>
          <div style={{fontSize:'18px',fontWeight:'700',color:'var(--accent)'}}>⚗️ Patent Hunter</div>
          <div style={{fontSize:'11px',color:'var(--muted)'}}>CME / CSSD / SPD — UFSC Mestrado 2025</div>
        </div>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginLeft:'auto'}}>
          <span className="badge badge-lens">🔵 Lens.org</span>
          <span className="badge badge-epo">🟣 EPO OPS</span>
          <span className="badge badge-inpi">🟢 INPI pePI</span>
        </div>
      </div>
    </header>
  );
}

function Toggle({ checked, onChange, label }) {
  return (
    <label style={{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',fontSize:'13px'}}>
      <label className="toggle">
        <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)} />
        <span className="slider"></span>
      </label>
      {label}
    </label>
  );
}

function Sidebar({ config, setConfig, onStart, running, done, sessionId }) {
  return (
    <aside style={{width:'280px',minWidth:'220px',background:'var(--surface)',borderRight:'1px solid var(--border)',padding:'16px',overflowY:'auto',flexShrink:0}}>
      <div style={{fontSize:'12px',color:'var(--muted)',fontWeight:'600',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'1px'}}>Credenciais</div>

      <div style={{marginBottom:'10px'}}>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'4px'}}>Lens.org Token</div>
        <input className="input" type="password" placeholder="Bearer token…"
          value={config.lens_token} onChange={e => setConfig(c=>({...c,lens_token:e.target.value}))} />
      </div>
      <div style={{marginBottom:'10px'}}>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'4px'}}>EPO Key</div>
        <input className="input" type="password" placeholder="Consumer key…"
          value={config.epo_key} onChange={e => setConfig(c=>({...c,epo_key:e.target.value}))} />
      </div>
      <div style={{marginBottom:'16px'}}>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'4px'}}>EPO Secret</div>
        <input className="input" type="password" placeholder="Consumer secret…"
          value={config.epo_secret} onChange={e => setConfig(c=>({...c,epo_secret:e.target.value}))} />
      </div>

      <div style={{fontSize:'12px',color:'var(--muted)',fontWeight:'600',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'1px'}}>Fontes</div>
      <div style={{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'16px'}}>
        <Toggle checked={config.use_lens} onChange={v => setConfig(c=>({...c,use_lens:v}))} label="Lens.org" />
        <Toggle checked={config.use_epo}  onChange={v => setConfig(c=>({...c,use_epo:v}))}  label="EPO OPS" />
        <Toggle checked={config.use_inpi} onChange={v => setConfig(c=>({...c,use_inpi:v}))} label="INPI pePI" />
      </div>

      <div style={{fontSize:'12px',color:'var(--muted)',fontWeight:'600',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'1px'}}>16 Queries</div>
      <div style={{display:'flex',flexDirection:'column',gap:'4px',marginBottom:'20px',maxHeight:'260px',overflowY:'auto'}}>
        {QUERIES.map(q => (
          <div key={q.id} style={{display:'flex',gap:'6px',alignItems:'flex-start',padding:'4px 6px',borderRadius:'6px',background:'var(--surface2)',border:'1px solid var(--border)'}}>
            <span style={{fontSize:'10px',fontWeight:'700',padding:'1px 5px',borderRadius:'4px',marginTop:'1px',
              background: q.fonte==='Lens'?'#0e3a5c':q.fonte==='EPO'?'#2d1b5c':'#0d3b2e',
              color: q.fonte==='Lens'?'var(--accent)':q.fonte==='EPO'?'#a78bfa':'var(--green)'}}>
              {q.fonte}
            </span>
            <span style={{fontSize:'11px',color:'var(--muted)',lineHeight:'1.3'}}>{q.desc}</span>
          </div>
        ))}
      </div>

      <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}}
        disabled={running} onClick={onStart}>
        {running ? '⏳ Buscando…' : '🔍 Iniciar Busca'}
      </button>
    </aside>
  );
}

function LogPanel({ logs }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) ref.current.scrollTop = ref.current.scrollHeight;
  }, [logs]);

  return (
    <div ref={ref} style={{
      background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'8px',
      padding:'10px',height:'220px',overflowY:'auto',fontFamily:'monospace'
    }}>
      {logs.length === 0 && <div style={{color:'var(--muted)',fontSize:'12px'}}>Aguardando início da busca…</div>}
      {logs.map((l, i) => (
        <div key={i} className={`log-line log-${l.level||'info'}`}>
          <span style={{color:'var(--muted)',marginRight:'8px'}}>{l.ts}</span>
          {l.msg}
        </div>
      ))}
    </div>
  );
}

function StatsRow({ results }) {
  const total = results.length;
  const lens  = results.filter(r => r.fonte === 'Lens.org').length;
  const epo   = results.filter(r => r.fonte === 'EPO OPS').length;
  const inpi  = results.filter(r => r.fonte === 'INPI pePI').length;

  return (
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'10px'}}>
      <div className="stat-card">
        <div className="stat-val" style={{color:'var(--text)'}}>{total}</div>
        <div className="stat-lbl">Total</div>
      </div>
      <div className="stat-card">
        <div className="stat-val" style={{color:'var(--accent)'}}>{lens}</div>
        <div className="stat-lbl">Lens.org</div>
      </div>
      <div className="stat-card">
        <div className="stat-val" style={{color:'#a78bfa'}}>{epo}</div>
        <div className="stat-lbl">EPO OPS</div>
      </div>
      <div className="stat-card">
        <div className="stat-val" style={{color:'var(--green)'}}>{inpi}</div>
        <div className="stat-lbl">INPI pePI</div>
      </div>
    </div>
  );
}

function PatentsTable({ results }) {
  if (results.length === 0)
    return <div style={{color:'var(--muted)',padding:'20px',textAlign:'center',fontSize:'13px'}}>Nenhuma patente coletada ainda.</div>;

  return (
    <div style={{overflowX:'auto'}}>
      <table>
        <thead>
          <tr>
            <th>Fonte</th><th>Query</th><th>Número</th><th>Título</th>
            <th>Depositante</th><th>Data</th><th>IPC</th>
          </tr>
        </thead>
        <tbody>
          {results.map((r, i) => (
            <tr key={i}>
              <td>
                <span className={
                  r.fonte==='Lens.org'?'fonte-lens':r.fonte==='EPO OPS'?'fonte-epo':'fonte-inpi'
                } style={{fontWeight:'600',fontSize:'11px'}}>{r.fonte}</span>
              </td>
              <td style={{color:'var(--muted)',fontSize:'11px'}}>{r.query_id}</td>
              <td style={{fontFamily:'monospace',fontSize:'11px'}}>{r.numero}</td>
              <td title={r.titulo}>{r.titulo}</td>
              <td title={r.depositante} style={{color:'var(--muted)'}}>{r.depositante}</td>
              <td style={{color:'var(--muted)',whiteSpace:'nowrap'}}>{r.data_pub}</td>
              <td style={{color:'var(--muted)',fontSize:'11px'}}>{r.ipc}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function SumarioTable({ sumario }) {
  if (sumario.length === 0)
    return <div style={{color:'var(--muted)',padding:'20px',textAlign:'center',fontSize:'13px'}}>Sumário disponível após a busca.</div>;

  const totalColetado = sumario.reduce((a, s) => a + (s.coletado||0), 0);

  return (
    <div style={{overflowX:'auto'}}>
      <table>
        <thead>
          <tr>
            <th>Query ID</th><th>Descrição</th><th>Fonte</th>
            <th>Total (base)</th><th>Coletados</th><th>Excluídos</th><th>Selecionados</th>
          </tr>
        </thead>
        <tbody>
          {sumario.map((s, i) => (
            <tr key={i}>
              <td style={{fontFamily:'monospace',fontSize:'11px'}}>{s.query_id}</td>
              <td title={s.descricao}>{s.descricao}</td>
              <td><span className={
                s.fonte==='Lens.org'?'fonte-lens':s.fonte==='EPO OPS'?'fonte-epo':'fonte-inpi'
              } style={{fontWeight:'600',fontSize:'11px'}}>{s.fonte}</span></td>
              <td style={{textAlign:'right'}}>{s.total}</td>
              <td style={{textAlign:'right',fontWeight:'600'}}>{s.coletado}</td>
              <td style={{color:'var(--yellow)',fontSize:'11px'}}>{s.excluidos}</td>
              <td style={{color:'var(--yellow)',fontSize:'11px'}}>{s.selecionados}</td>
            </tr>
          ))}
          <tr style={{background:'#2E74B5',fontWeight:'700'}}>
            <td colSpan={4} style={{color:'#fff'}}>TOTAL</td>
            <td style={{color:'#fff',textAlign:'right'}}>{totalColetado}</td>
            <td style={{color:'#fff'}}>—</td>
            <td style={{color:'#fff'}}>—</td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

function ProgressBar({ pct, label }) {
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px',fontSize:'12px',color:'var(--muted)'}}>
        <span>{label || 'Aguardando…'}</span>
        <span style={{color:'var(--accent)',fontWeight:'600'}}>{pct}%</span>
      </div>
      <div className="progress-bar">
        <div className="progress-fill" style={{width:`${pct}%`}} />
      </div>
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [config, setConfig] = useState({
    lens_token:'', epo_key:'', epo_secret:'',
    use_lens:true, use_epo:true, use_inpi:true,
  });
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const [sessionId, setSessionId] = useState(null);
  const [logs, setLogs] = useState([]);
  const [results, setResults] = useState([]);
  const [sumario, setSumario] = useState([]);
  const [progress, setProgress] = useState({ pct:0, label:'' });
  const [activeTab, setActiveTab] = useState('patentes');
  const evtRef = useRef(null);

  const addLog = (entry) => setLogs(prev => [...prev.slice(-500), entry]);
  const addResult = (r) => setResults(prev => [...prev, r]);

  const handleStart = async () => {
    setRunning(true);
    setDone(false);
    setLogs([]);
    setResults([]);
    setSumario([]);
    setProgress({ pct:0, label:'Iniciando…' });

    if (evtRef.current) evtRef.current.close();

    const resp = await fetch('/api/search/start', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(config),
    });
    const data = await resp.json();
    const sid = data.session_id;
    setSessionId(sid);

    const es = new EventSource(`/api/search/stream/${sid}`);
    evtRef.current = es;

    es.addEventListener('log', e => {
      const d = JSON.parse(e.data);
      addLog(d);
    });
    es.addEventListener('result', e => {
      addResult(JSON.parse(e.data));
    });
    es.addEventListener('progress', e => {
      setProgress(JSON.parse(e.data));
    });
    es.addEventListener('done', e => {
      const d = JSON.parse(e.data);
      es.close();
      setRunning(false);
      setDone(true);
      setProgress({ pct:100, label:`Concluído — ${d.total} patentes` });
      // refresh sumario via status
      fetch(`/api/search/status/${sid}`)
        .then(r => r.json())
        .then(s => setSumario(s.sumario || []));
    });
    es.onerror = () => {
      if (!done) addLog({ ts:'--:--:--', msg:'Conexão SSE encerrada.', level:'warn' });
      es.close();
    };
  };

  const download = (url) => window.open(url, '_blank');

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      <Header />
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        <Sidebar config={config} setConfig={setConfig} onStart={handleStart} running={running} done={done} sessionId={sessionId} />

        <main style={{flex:1,padding:'16px',overflowY:'auto',display:'flex',flexDirection:'column',gap:'12px'}}>
          <ProgressBar pct={progress.pct} label={progress.label} />

          <StatsRow results={results} />

          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',padding:'12px'}}>
            <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'6px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'1px'}}>Log em Tempo Real</div>
            <LogPanel logs={logs} />
          </div>

          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',overflow:'hidden'}}>
            <div style={{display:'flex',borderBottom:'1px solid var(--border)',padding:'0 12px',background:'var(--surface2)'}}>
              <button className={`tab ${activeTab==='patentes'?'active':''}`} onClick={()=>setActiveTab('patentes')}>
                Patentes ({results.length})
              </button>
              <button className={`tab ${activeTab==='sumario'?'active':''}`} onClick={()=>setActiveTab('sumario')}>
                Sumário PRISMA ({sumario.length})
              </button>
            </div>
            <div style={{maxHeight:'360px',overflowY:'auto'}}>
              {activeTab==='patentes' ? <PatentsTable results={results} /> : <SumarioTable sumario={sumario} />}
            </div>
          </div>

          {done && sessionId && (
            <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
              <button className="btn btn-green" onClick={() => download(`/api/export/excel/${sessionId}`)}>
                📊 Exportar Excel (.xlsx)
              </button>
              <button className="btn btn-purple" onClick={() => download(`/api/export/csv/${sessionId}`)}>
                📄 Exportar CSV (UTF-8 BOM)
              </button>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
